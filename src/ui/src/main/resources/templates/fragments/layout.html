<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout (template, menu)"
  th:replace="~{fragments/bare :: bare (~{::body})}"
>
  <body>
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
      <div class="max-w-5xl mx-auto px-6">
        <div class="flex justify-between items-center h-14">
          <a th:href="@{/}">
            <div class="flex items-center gap-2">
              <i class="fas fa-briefcase text-lg text-primary-500"></i>
              <span class="text-sm font-semibold text-gray-800 tracking-wide">Secret Shop</span>
            </div>
          </a>
          <div class="flex items-center space-x-8">
            <a
              id="menu-home"
              th:href="@{/}"
              class="text-sm text-gray-500 hover:text-primary-500 font-medium transition duration-150"
              th:text="#{nav.home}"
              >Home</a
            >
            <a
              id="menu-catalog"
              th:href="@{/catalog}"
              class="text-sm text-gray-500 hover:text-primary-500 font-medium transition duration-150"
              th:text="#{nav.catalog}"
              >Catalog</a
            >
          </div>
          <div class="flex items-center">
            <a th:href="@{/cart}" id="go-cart">
              <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition duration-150">
                <i class="fas fa-shopping-cart text-base"></i>
                <span
                  class="bg-primary-500 text-white text-xs font-bold rounded-full h-5 min-w-[1.25rem] flex items-center justify-center"
                  th:text="${cart.numItems}"
                >0</span>
              </button>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow bg-gray-50">
      <th:block th:insert="${template}" />
    </main>
  </body>
</html>
