apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-catalog-canary
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: retail-store
  source:
    repoURL: REPO_URL
    targetRevision: REPO_BRANCH_PROD
    path: src/catalog/chart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - values-prod-canary.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
