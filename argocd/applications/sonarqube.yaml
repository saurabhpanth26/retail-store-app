apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: retail-store

  source:
    repoURL: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube
    targetRevision: "2026.3.0"
    helm:
      valuesObject:
        image:
          pullPolicy: IfNotPresent

        monitoringPasscode: "sonarqube-monitoring-passcode"

        community:
          enabled: true

        jdbcOverwrite:
          enabled: true
          jdbcUrl: "jdbc:postgresql://sonarqube-postgres.sonarqube.svc.cluster.local:5432/sonarqube"
          jdbcUsername: "sonarqube"
          jdbcPassword: "sonarqube"

        initSysctl:
          enabled: true
          vmMaxMapCount: 524288
          fsFileMax: 131072
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false

        persistence:
          enabled: true
          storageClass: "ebs-sc"
          size: 10Gi

        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - name: sonarqube.saurabh-devops.in
              path: /
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/proxy-body-size: "64m"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
          tls: []

        service:
          type: ClusterIP
          port: 9000

        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi

        securityContext:
          runAsUser: 1000
          runAsGroup: 0

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
