name: CI/CD - Prod (Canary)

# ──────────────────────────────────────────────────────────────────────────────
# Production Canary Deployment Pipeline
#
# Flow:
#   detect-changes
#       │
#   build-push            ← build prod-<sha> image, push to ECR
#       │
#   canary-deploy         ← update values-prod-canary.yaml → ArgoCD deploys
#       │                    UI: 20% NGINX canary  |  Backend: 1 canary pod
#       │
#   canary-health-check   ← AUTOMATED GATE
#       │                    • wait for all canary pods to become Ready
#       │                    • HTTP smoke test the canary pod directly
#       │                    ↓ FAIL → auto-rollback (scale canary to 0)
#       │                             pipeline stops, 0% users on faulty pods
#       │                    ↓ PASS → continue
#       │
#   canary-approval       ← manual gate (GitHub Environment: "production")
#       │                    reviewer validates 20% live traffic behaviour
#       │
#   stable-promote        ← update values-prod.yaml → ArgoCD promotes to 100%
#       │
#   summary
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths: ['src/**', 'terraform/**', 'argocd/**', '.github/workflows/prod-cicd.yaml']
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

# ══════════════════════════════════════════════════════════════════════════════
# DETECT CHANGES
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
      changed-services: ${{ steps.changes.outputs.changed-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED=()

          WORKFLOW_CHANGED=false
          if git diff --name-only HEAD~1 HEAD | grep -q "^\.github/workflows/prod-cicd\.yaml$"; then
            WORKFLOW_CHANGED=true
          fi

          for svc in "${SERVICES[@]}"; do
            # Exclude pipeline-managed values files — changes to those files are
            # committed by the pipeline itself and must not trigger a rebuild.
            SVC_CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep "^src/$svc/" \
              | grep -vE "chart/values-prod(-canary)?\.yaml$" \
              | grep -c .)
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || \
               [ "$WORKFLOW_CHANGED" == "true" ] || \
               [ "$SVC_CHANGED" -gt 0 ]; then
              CHANGED+=("$svc")
              echo "✅ $svc"
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          MATRIX="["; for i in "${!CHANGED[@]}"; do
            [ $i -gt 0 ] && MATRIX+=","
            MATRIX+="\"${CHANGED[$i]}\""
          done; MATRIX+="]"

          echo "has-changes=true"               >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX}"   >> $GITHUB_OUTPUT
          echo "changed-services=${CHANGED[*]}" >> $GITHUB_OUTPUT
          echo "📦 Services: ${CHANGED[*]}"

# ══════════════════════════════════════════════════════════════════════════════
# BUILD & PUSH IMAGE TO ECR
# ══════════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SVC="${{ matrix.service }}"
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
          echo "TAG=${TAG}"       >> $GITHUB_ENV
          echo "ECR_REPO=${ECR}" >> $GITHUB_ENV
          echo "SVC=${SVC}"      >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names "retail-store-${SVC}" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "retail-store-${SVC}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ env.TAG }}
            ${{ env.ECR_REPO }}:prod-latest

# ══════════════════════════════════════════════════════════════════════════════
# CANARY DEPLOY — update all values-prod-canary.yaml in one commit → no race
# Single job (no matrix) → one push to main → ArgoCD syncs all canary pods
# ══════════════════════════════════════════════════════════════════════════════
  canary-deploy:
    name: Canary Deploy — All Services
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push]
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canary values for all changed services
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          git config user.email "gitops@github.com"
          git config user.name "GitOps Bot"
          git fetch origin main
          git checkout main

          for SVC in "${SERVICES[@]}"; do
            ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
            CANARY_VALUES="src/${SVC}/chart/values-prod-canary.yaml"

            cp "${CANARY_VALUES}" "${CANARY_VALUES}.bak"
            awk -v repo="${ECR}" -v tag="${TAG}" '
              BEGIN { in_img=0; done_repo=0; done_tag=0 }
              /^image:/                                           { in_img=1; print; next }
              in_img && /^[[:space:]]*repository:/ && !done_repo { print "  repository: " repo; done_repo=1; next }
              in_img && /^[[:space:]]*tag:/        && !done_tag  { print "  tag: \"" tag "\""; done_tag=1; next }
              /^[a-zA-Z]/ && !/^image:/                          { in_img=0 }
              { print }
            ' "${CANARY_VALUES}.bak" > "${CANARY_VALUES}"

            if grep -q "\"${TAG}\"" "${CANARY_VALUES}"; then
              rm "${CANARY_VALUES}.bak"
              echo "✅ ${SVC} → ${TAG}"
            else
              mv "${CANARY_VALUES}.bak" "${CANARY_VALUES}"
              echo "❌ ${SVC} values update failed"; exit 1
            fi
          done

      - name: Commit & push all canary values in one push
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          for SVC in "${SERVICES[@]}"; do
            git add "src/${SVC}/chart/values-prod-canary.yaml"
          done

          if ! git diff --cached --quiet; then
            git commit -m "ci(canary): [${SERVICES[*]}] → ${TAG} [skip ci]"
            for i in {1..5}; do
              git push origin main && break || {
                echo "Push conflict — retry $i/5"
                git pull --rebase origin main
                sleep $((i * 3))
              }
              [ $i -eq 5 ] && { echo "❌ push failed"; exit 1; }
            done
            echo "✅ canary deployed: [${SERVICES[*]}] → ${TAG} (20% traffic)"
          else
            echo "ℹ️ No canary values changed — nothing to push"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# CANARY HEALTH CHECK — validate pods are healthy BEFORE any user traffic
# If pods fail → auto rollback (scale to 0) + pipeline stops
# ══════════════════════════════════════════════════════════════════════════════
  canary-health-check:
    name: Canary Health Check
    runs-on: ubuntu-latest
    needs: [detect-changes, canary-deploy]
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          CLUSTER=$(aws eks list-clusters --query 'clusters[?contains(@, `retail-store`)] | [0]' --output text)
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "${CLUSTER}"
          echo "✅ kubectl configured for cluster: ${CLUSTER}"

      - name: Diagnose ArgoCD canary app state
        run: |
          echo "=== All ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide || echo "❌ Could not list ArgoCD apps"

          echo ""
          echo "=== Canary Application details ==="
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})
          for SVC in "${SERVICES[@]}"; do
            APP="retail-store-${SVC}-canary"
            echo "--- ${APP} ---"
            kubectl get application/${APP} -n argocd \
              -o jsonpath='sync={.status.sync.status} health={.status.health.status} message={.status.conditions[*].message}' \
              2>/dev/null && echo "" || echo "❌ Application ${APP} NOT FOUND in ArgoCD"
          done

          echo ""
          echo "=== Deployments in retail-store-prod ==="
          kubectl get deployments -n retail-store-prod 2>/dev/null || echo "❌ Could not list deployments"

      - name: Trigger immediate ArgoCD refresh for canary apps
        run: |
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})
          for SVC in "${SERVICES[@]}"; do
            kubectl annotate application/retail-store-${SVC}-canary \
              -n argocd \
              argocd.argoproj.io/refresh=normal \
              --overwrite 2>/dev/null \
              && echo "✅ Triggered refresh: retail-store-${SVC}-canary" \
              || echo "⚠️  Application retail-store-${SVC}-canary NOT FOUND — canary apps may need to be applied via Terraform"
          done

      - name: Wait for canary pods to be Ready (5 min timeout)
        id: pod-check
        run: |
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})
          FAILED=()

          for SVC in "${SERVICES[@]}"; do
            DEPLOY="retail-store-${SVC}-canary"
            echo "⏳ Waiting for ArgoCD to create ${DEPLOY} ..."

            # ArgoCD refresh was triggered above; allow up to 5 min for sync + rollout
            CREATED=false
            for attempt in $(seq 1 30); do
              if kubectl get deployment/${DEPLOY} -n retail-store-prod &>/dev/null; then
                CREATED=true
                echo "✅ ${DEPLOY} created by ArgoCD (${attempt}x10s)"
                break
              fi
              echo "  not found yet — retrying in 10s ($((attempt * 10))s elapsed)"
              sleep 10
            done

            if [ "$CREATED" == "false" ]; then
              echo "❌ ${DEPLOY} was never created by ArgoCD (timed out after 5 min)"
              FAILED+=("${DEPLOY}")
              continue
            fi

            if kubectl rollout status deployment/${DEPLOY} \
                -n retail-store-prod \
                --timeout=120s 2>&1; then
              echo "✅ ${DEPLOY} is Ready"
            else
              echo "❌ ${DEPLOY} failed to become Ready"
              FAILED+=("${DEPLOY}")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "FAILED_DEPLOYMENTS=${FAILED[*]}" >> $GITHUB_ENV
            echo "health_passed=false" >> $GITHUB_OUTPUT
          else
            echo "health_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: HTTP smoke test — canary pod health endpoint
        id: http-check
        if: steps.pod-check.outputs.health_passed == 'true'
        run: |
          # Port-forward the canary UI pod and hit its health endpoint
          # (avoids depending on DNS/NLB being ready in all environments)
          POD=$(kubectl get pod -n retail-store-prod \
            -l app.kubernetes.io/name=retail-store-ui-canary \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

          if [ -z "$POD" ]; then
            echo "⚠️  No canary UI pod found — skipping HTTP check"
            echo "http_passed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Testing pod: ${POD}"
          kubectl port-forward pod/${POD} 9090:8080 -n retail-store-prod &
          PF_PID=$!
          sleep 5

          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            http://localhost:9090/actuator/health/readiness \
            --max-time 10 || echo "000")

          kill ${PF_PID} 2>/dev/null || true

          echo "HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" == "200" ]; then
            echo "✅ HTTP smoke test passed"
            echo "http_passed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ HTTP smoke test failed: ${HTTP_STATUS}"
            echo "http_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: AUTO ROLLBACK — scale canary to 0 (pods unhealthy)
        if: |
          steps.pod-check.outputs.health_passed == 'false' ||
          steps.http-check.outputs.http_passed == 'false'
        run: |
          echo "🔄 Rolling back canary — scaling all canary deployments to 0"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          for SVC in "${SERVICES[@]}"; do
            DEPLOY="retail-store-${SVC}-canary"
            kubectl scale deployment/${DEPLOY} \
              --replicas=0 \
              -n retail-store-prod 2>/dev/null && \
              echo "✅ Scaled ${DEPLOY} to 0" || \
              echo "⚠️  Could not scale ${DEPLOY} (may not exist yet)"
          done

          echo ""
          echo "❌ Canary health check FAILED"
          echo "   Stable deployment is unaffected — 100% traffic on stable pods"
          echo "   Fix the issue and re-push to main to retry"
          exit 1

      - name: Health check passed
        run: |
          echo "✅ All canary pods are healthy — proceeding to manual approval"

# ══════════════════════════════════════════════════════════════════════════════
# CANARY APPROVAL GATE — manual sign-off after automated checks pass
# Configure GitHub Environment "production" with Required Reviewers
# ══════════════════════════════════════════════════════════════════════════════
  canary-approval:
    name: Approve Canary → Promote to Stable
    runs-on: ubuntu-latest
    needs: canary-health-check
    environment: production
    steps:
      - name: Canary is healthy — awaiting approval
        run: |
          echo "All canary pods passed automated health checks."
          echo ""
          echo "UI (20% traffic):  https://saurabh-devops.in"
          echo "ArgoCD:            https://argocd.saurabh-devops.in"
          echo ""
          echo "Validate canary behaviour, then approve to promote to 100% stable."

# ══════════════════════════════════════════════════════════════════════════════
# CANARY ROLLBACK — reviewer rejected the approval
# Scales canary to 0 so stable serves 100% again
# ══════════════════════════════════════════════════════════════════════════════
  canary-rollback-on-reject:
    name: Rollback Canary (Rejected)
    runs-on: ubuntu-latest
    needs: [detect-changes, canary-approval]
    if: |
      always() &&
      needs.detect-changes.outputs.has-changes == 'true' &&
      needs.canary-approval.result == 'failure'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          CLUSTER=$(aws eks list-clusters \
            --query 'clusters[?contains(@, `retail-store`)] | [0]' \
            --output text)
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "${CLUSTER}"

      - name: Scale all canary deployments to 0
        run: |
          echo "🔄 Reviewer rejected — rolling back all canary deployments"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          for SVC in "${SERVICES[@]}"; do
            DEPLOY="retail-store-${SVC}-canary"
            kubectl scale deployment/${DEPLOY} \
              --replicas=0 \
              -n retail-store-prod 2>/dev/null && \
              echo "✅ Rolled back: ${DEPLOY}" || \
              echo "⚠️  Skipped (not found): ${DEPLOY}"
          done

          echo ""
          echo "✅ Rollback complete — 100% traffic back on stable pods"

# ══════════════════════════════════════════════════════════════════════════════
# STABLE PROMOTE — approved, update all values-prod.yaml in one commit → 100%
# Single job (no matrix) → one push to main → ArgoCD rolls out all services
# ══════════════════════════════════════════════════════════════════════════════
  stable-promote:
    name: Stable Promote — All Services (100%)
    runs-on: ubuntu-latest
    needs: [detect-changes, canary-approval]
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update stable values for all changed services
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          git config user.email "gitops@github.com"
          git config user.name "GitOps Bot"
          git fetch origin main
          git checkout main

          for SVC in "${SERVICES[@]}"; do
            ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
            STABLE_VALUES="src/${SVC}/chart/values-prod.yaml"

            cp "${STABLE_VALUES}" "${STABLE_VALUES}.bak"
            awk -v repo="${ECR}" -v tag="${TAG}" '
              BEGIN { in_img=0; done_repo=0; done_tag=0 }
              /^image:/                                           { in_img=1; print; next }
              in_img && /^[[:space:]]*repository:/ && !done_repo { print "  repository: " repo; done_repo=1; next }
              in_img && /^[[:space:]]*tag:/        && !done_tag  { print "  tag: \"" tag "\""; done_tag=1; next }
              /^[a-zA-Z]/ && !/^image:/                          { in_img=0 }
              { print }
            ' "${STABLE_VALUES}.bak" > "${STABLE_VALUES}"

            if grep -q "\"${TAG}\"" "${STABLE_VALUES}"; then
              rm "${STABLE_VALUES}.bak"
              echo "✅ ${SVC} → ${TAG}"
            else
              mv "${STABLE_VALUES}.bak" "${STABLE_VALUES}"
              echo "❌ ${SVC} values update failed"; exit 1
            fi
          done

      - name: Commit & push all stable values in one push
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          SERVICES=(${{ needs.detect-changes.outputs.changed-services }})

          for SVC in "${SERVICES[@]}"; do
            git add "src/${SVC}/chart/values-prod.yaml"
          done

          if ! git diff --cached --quiet; then
            git commit -m "ci(prod): [${SERVICES[*]}] → ${TAG} [skip ci]"
            for i in {1..5}; do
              git push origin main && break || {
                echo "Push conflict — retry $i/5"
                git pull --rebase origin main
                sleep $((i * 3))
              }
              [ $i -eq 5 ] && { echo "❌ push failed"; exit 1; }
            done
            echo "✅ Stable promoted: [${SERVICES[*]}] → ${TAG} (100% traffic)"
          else
            echo "ℹ️ No stable values changed — nothing to push"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# SUMMARY
# ══════════════════════════════════════════════════════════════════════════════
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push, canary-deploy, canary-health-check, canary-approval, canary-rollback-on-reject, stable-promote]
    if: always()
    steps:
      - name: Write summary
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"

          echo "## Production Canary Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`retail-store-prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | \`https://saurabh-devops.in\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Deploy (20%) | ${{ needs.canary-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Health Check | ${{ needs.canary-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Approval | ${{ needs.canary-approval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Rollback (if rejected) | ${{ needs.canary-rollback-on-reject.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stable Promote (100%) | ${{ needs.stable-promote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          HEALTH="${{ needs.canary-health-check.result }}"
          PROMOTE="${{ needs.stable-promote.result }}"

          if [ "$PROMOTE" == "success" ]; then
            echo "✅ **Full rollout complete — 100% traffic on stable pods**" >> $GITHUB_STEP_SUMMARY
          elif [ "$HEALTH" == "failure" ]; then
            echo "🔄 **Auto-rollback — canary pods were unhealthy, 0% user impact**" >> $GITHUB_STEP_SUMMARY
            echo "> Stable unaffected. Fix the issue and re-push to main." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.canary-rollback-on-reject.result }}" == "success" ]; then
            echo "🔄 **Reviewer rejected — canary rolled back to 0, stable at 100%**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.canary-approval.result }}" == "success" ]; then
            echo "🔄 **Approved — stable promote in progress**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏳ **Canary healthy — awaiting manual approval**" >> $GITHUB_STEP_SUMMARY
          fi
