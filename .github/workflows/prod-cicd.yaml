name: CI/CD - Prod (Canary)

# ──────────────────────────────────────────────────────────────────────────────
# Production Canary Deployment Pipeline
#
# Flow:
#   detect-changes
#       │
#   build-push          ← build prod-<sha> image, push to ECR
#       │
#   canary-deploy       ← update values-prod-canary.yaml → ArgoCD deploys
#       │                  UI:      20% traffic via NGINX canary annotations
#       │                  Backend: 1 canary pod alongside stable pods
#       │
#   canary-approval     ← manual gate (GitHub Environment: "production")
#       │                  reviewer validates canary in prod before promoting
#       │
#   stable-promote      ← update values-prod.yaml → ArgoCD promotes to 100%
#       │
#   summary
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

# ══════════════════════════════════════════════════════════════════════════════
# DETECT CHANGES
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
      changed-services: ${{ steps.changes.outputs.changed-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED=()

          for svc in "${SERVICES[@]}"; do
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || \
               git diff --name-only HEAD~1 HEAD | grep -q "^src/$svc/"; then
              CHANGED+=("$svc")
              echo "✅ $svc"
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          MATRIX="["; for i in "${!CHANGED[@]}"; do
            [ $i -gt 0 ] && MATRIX+=","
            MATRIX+="\"${CHANGED[$i]}\""
          done; MATRIX+="]"

          echo "has-changes=true"               >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX}"   >> $GITHUB_OUTPUT
          echo "changed-services=${CHANGED[*]}" >> $GITHUB_OUTPUT
          echo "📦 Services: ${CHANGED[*]}"

# ══════════════════════════════════════════════════════════════════════════════
# BUILD & PUSH IMAGE TO ECR
# ══════════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SVC="${{ matrix.service }}"
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
          echo "TAG=${TAG}"        >> $GITHUB_ENV
          echo "ECR_REPO=${ECR}"  >> $GITHUB_ENV
          echo "SVC=${SVC}"       >> $GITHUB_ENV
          echo "Tag: ${TAG} | Repo: ${ECR}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names "retail-store-${SVC}" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "retail-store-${SVC}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ env.TAG }}
            ${{ env.ECR_REPO }}:prod-latest

# ══════════════════════════════════════════════════════════════════════════════
# CANARY DEPLOY — update values-prod-canary.yaml → ArgoCD syncs canary pods
# ══════════════════════════════════════════════════════════════════════════════
  canary-deploy:
    name: Canary Deploy — ${{ matrix.service }} (20%)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push]
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          SVC="${{ matrix.service }}"
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
          echo "TAG=${TAG}"       >> $GITHUB_ENV
          echo "ECR_REPO=${ECR}" >> $GITHUB_ENV
          echo "SVC=${SVC}"      >> $GITHUB_ENV

      - name: Update values-prod-canary.yaml on gitops branch
        run: |
          CANARY_VALUES="src/${SVC}/chart/values-prod-canary.yaml"

          git config user.email "gitops@github.com"
          git config user.name "GitOps Bot"

          git fetch origin gitops
          git checkout gitops

          cp "${CANARY_VALUES}" "${CANARY_VALUES}.bak"
          awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
            BEGIN { in_img=0; done_repo=0; done_tag=0 }
            /^image:/                                           { in_img=1; print; next }
            in_img && /^[[:space:]]*repository:/ && !done_repo { print "  repository: " repo; done_repo=1; next }
            in_img && /^[[:space:]]*tag:/        && !done_tag  { print "  tag: \"" tag "\""; done_tag=1; next }
            /^[a-zA-Z]/ && !/^image:/                          { in_img=0 }
            { print }
          ' "${CANARY_VALUES}.bak" > "${CANARY_VALUES}"

          if grep -q "\"${TAG}\"" "${CANARY_VALUES}"; then
            rm "${CANARY_VALUES}.bak"
            echo "✅ Canary values updated: ${SVC} → ${TAG}"
          else
            mv "${CANARY_VALUES}.bak" "${CANARY_VALUES}"
            echo "❌ Canary values update failed"; exit 1
          fi

      - name: Commit & push canary to gitops
        run: |
          CANARY_VALUES="src/${SVC}/chart/values-prod-canary.yaml"

          if ! git diff --quiet "${CANARY_VALUES}"; then
            git add "${CANARY_VALUES}"
            git commit -m "ci(canary): ${SVC} → ${TAG} [skip ci]"

            for i in {1..3}; do
              git push origin gitops && break || {
                git pull --rebase origin gitops
                sleep $((i * 2))
              }
              [ $i -eq 3 ] && { echo "❌ push failed"; exit 1; }
            done
            echo "✅ Canary live — ArgoCD will sync retail-store-${SVC}-canary"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# CANARY APPROVAL GATE
# Pauses here until a reviewer approves in GitHub → Settings → Environments
# Configure "production" environment with Required Reviewers before using.
# ══════════════════════════════════════════════════════════════════════════════
  canary-approval:
    name: Approve Canary → Promote to Stable
    runs-on: ubuntu-latest
    needs: canary-deploy
    environment: production
    steps:
      - name: Canary is live — awaiting approval
        run: |
          echo "Canary deployment is live."
          echo ""
          echo "UI (20% traffic):  https://saurabh-devops.in"
          echo "ArgoCD:            https://argocd.saurabh-devops.in"
          echo ""
          echo "Validate the canary, then approve this job to promote to stable."

# ══════════════════════════════════════════════════════════════════════════════
# STABLE PROMOTE — update values-prod.yaml → ArgoCD rolls out 100%
# ══════════════════════════════════════════════════════════════════════════════
  stable-promote:
    name: Stable Promote — ${{ matrix.service }} (100%)
    runs-on: ubuntu-latest
    needs: [detect-changes, canary-approval]
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          SVC="${{ matrix.service }}"
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
          echo "TAG=${TAG}"       >> $GITHUB_ENV
          echo "ECR_REPO=${ECR}" >> $GITHUB_ENV
          echo "SVC=${SVC}"      >> $GITHUB_ENV

      - name: Update values-prod.yaml on gitops branch
        run: |
          STABLE_VALUES="src/${SVC}/chart/values-prod.yaml"

          git config user.email "gitops@github.com"
          git config user.name "GitOps Bot"

          git fetch origin gitops
          git checkout gitops

          cp "${STABLE_VALUES}" "${STABLE_VALUES}.bak"
          awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
            BEGIN { in_img=0; done_repo=0; done_tag=0 }
            /^image:/                                           { in_img=1; print; next }
            in_img && /^[[:space:]]*repository:/ && !done_repo { print "  repository: " repo; done_repo=1; next }
            in_img && /^[[:space:]]*tag:/        && !done_tag  { print "  tag: \"" tag "\""; done_tag=1; next }
            /^[a-zA-Z]/ && !/^image:/                          { in_img=0 }
            { print }
          ' "${STABLE_VALUES}.bak" > "${STABLE_VALUES}"

          if grep -q "\"${TAG}\"" "${STABLE_VALUES}"; then
            rm "${STABLE_VALUES}.bak"
            echo "✅ Stable values updated: ${SVC} → ${TAG}"
          else
            mv "${STABLE_VALUES}.bak" "${STABLE_VALUES}"
            echo "❌ Stable values update failed"; exit 1
          fi

      - name: Commit & push stable to gitops
        run: |
          STABLE_VALUES="src/${SVC}/chart/values-prod.yaml"

          if ! git diff --quiet "${STABLE_VALUES}"; then
            git add "${STABLE_VALUES}"
            git commit -m "ci(prod): ${SVC} → ${TAG} [skip ci]"

            for i in {1..3}; do
              git push origin gitops && break || {
                git pull --rebase origin gitops
                sleep $((i * 2))
              }
              [ $i -eq 3 ] && { echo "❌ push failed"; exit 1; }
            done
            echo "✅ Stable promoted — ArgoCD will sync retail-store-${SVC}"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# SUMMARY
# ══════════════════════════════════════════════════════════════════════════════
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push, canary-deploy, canary-approval, stable-promote]
    if: always()
    steps:
      - name: Write summary
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"

          echo "## Production Canary Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`retail-store-prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | \`https://saurabh-devops.in\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Deploy (20%) | ${{ needs.canary-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Canary Approval | ${{ needs.canary-approval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stable Promote (100%) | ${{ needs.stable-promote.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.stable-promote.result }}" == "success" ]; then
            echo "✅ **Full rollout complete — ArgoCD syncing \`retail-store-prod\`**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.canary-approval.result }}" == "success" ]; then
            echo "🔄 **Canary approved — stable promote in progress**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.canary-deploy.result }}" == "success" ]; then
            echo "⏳ **Canary live at 20% — awaiting approval to promote**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline failed — check logs**" >> $GITHUB_STEP_SUMMARY
          fi
