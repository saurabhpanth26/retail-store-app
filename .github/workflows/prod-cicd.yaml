name: CI/CD - Prod

# ──────────────────────────────────────────────────────────────────────────────
# Production Promotion Pipeline
# All security scanning happens in dev-cicd.yaml (shift-left).
# This pipeline: detect changes → build → push to ECR → update gitops
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

# ══════════════════════════════════════════════════════════════════════════════
# DETECT CHANGES
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
      changed-services: ${{ steps.changes.outputs.changed-services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED=()

          for svc in "${SERVICES[@]}"; do
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] || \
               git diff --name-only HEAD~1 HEAD | grep -q "^src/$svc/"; then
              CHANGED+=("$svc")
              echo "✅ $svc"
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
            exit 0
          fi

          MATRIX="["; for i in "${!CHANGED[@]}"; do
            [ $i -gt 0 ] && MATRIX+=","
            MATRIX+="\"${CHANGED[$i]}\""
          done; MATRIX+="]"

          echo "has-changes=true"               >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX}"   >> $GITHUB_OUTPUT
          echo "changed-services=${CHANGED[*]}" >> $GITHUB_OUTPUT
          echo "📦 Services: ${CHANGED[*]}"

# ══════════════════════════════════════════════════════════════════════════════
# BUILD → ECR PUSH → GITOPS UPDATE
# ══════════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: Build & Push ${{ matrix.service }} → prod
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image variables
        run: |
          SVC="${{ matrix.service }}"
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"
          AWS_ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SVC}"
          echo "TAG=${TAG}"        >> $GITHUB_ENV
          echo "ECR_REPO=${ECR}"  >> $GITHUB_ENV
          echo "SVC=${SVC}"       >> $GITHUB_ENV
          echo "Tag: ${TAG} | Repo: ${ECR}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repo if needed
        run: |
          aws ecr describe-repositories --repository-names "retail-store-${SVC}" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "retail-store-${SVC}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - uses: docker/setup-buildx-action@v3

      - name: Build & push to ECR
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REPO }}:${{ env.TAG }}
            ${{ env.ECR_REPO }}:prod-latest

      - name: Update Helm values (values-prod.yaml)
        run: |
          VALUES_PATH="src/${SVC}/chart/values-prod.yaml"

          git config user.email "gitops@github.com"
          git config user.name "GitOps Bot"

          git fetch origin gitops
          git checkout gitops

          if [[ ! -f "${VALUES_PATH}" ]]; then
            printf "image:\n  repository: %s\n  tag: \"%s\"\n" "${ECR_REPO}" "${TAG}" > "${VALUES_PATH}"
          else
            cp "${VALUES_PATH}" "${VALUES_PATH}.bak"
            awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
              BEGIN { in_img=0; done_repo=0; done_tag=0 }
              /^image:/                                              { in_img=1; print; next }
              in_img && /^[[:space:]]*repository:/ && !done_repo    { print "  repository: " repo; done_repo=1; next }
              in_img && /^[[:space:]]*tag:/        && !done_tag     { print "  tag: \"" tag "\""; done_tag=1; next }
              /^[a-zA-Z]/ && !/^image:/                             { in_img=0 }
              { print }
            ' "${VALUES_PATH}.bak" > "${VALUES_PATH}"

            if grep -q "\"${TAG}\"" "${VALUES_PATH}"; then
              rm "${VALUES_PATH}.bak"
            else
              mv "${VALUES_PATH}.bak" "${VALUES_PATH}"
              echo "❌ values update failed"; exit 1
            fi
          fi

      - name: Commit & push to gitops
        run: |
          VALUES_PATH="src/${SVC}/chart/values-prod.yaml"

          if ! git diff --quiet "${VALUES_PATH}"; then
            git add "${VALUES_PATH}"
            git commit -m "ci(prod): ${SVC} → ${TAG} [skip ci]"

            for i in {1..3}; do
              git push origin gitops && break || {
                echo "Push conflict — retry $i/3"
                git pull --rebase origin gitops
                sleep $((i * 2))
              }
              [ $i -eq 3 ] && { echo "❌ push failed"; exit 1; }
            done
            echo "✅ gitops updated: ${SVC} → ${TAG}"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# SUMMARY
# ══════════════════════════════════════════════════════════════════════════════
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, docker-build-push]
    if: always()
    steps:
      - name: Write summary
        run: |
          TAG="prod-$(echo ${{ github.sha }} | cut -c1-7)"

          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`retail-store-prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | \`https://saurabh-devops.in\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.docker-build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitOps Update | ${{ needs.docker-build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.docker-build-push.result }}" == "success" ]; then
            echo "✅ **ArgoCD will sync \`retail-store-prod\` automatically**" >> $GITHUB_STEP_SUMMARY
            echo "> Services: ${{ needs.detect-changes.outputs.changed-services }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed — check workflow logs**" >> $GITHUB_STEP_SUMMARY
          fi
