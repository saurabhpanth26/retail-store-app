name: Deploy

on:
  push:
    branches: [dev, main]
    paths: ['src/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # dev branch → dev env, main branch → prod env
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changes.outputs.changed-services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          CHANGED_SERVICES=()

          echo "🔍 Checking for changes in services..."

          for service in "${SERVICES[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^src/$service/" || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              CHANGED_SERVICES+=("$service")
              echo "✅ Changes detected in: $service"
            else
              echo "⏭️ No changes in: $service"
            fi
          done

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🔄 Manual trigger - building all services"
            CHANGED_SERVICES=("ui" "catalog" "cart" "checkout" "orders")
          fi

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "❌ No services changed"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          MATRIX_JSON="["
          for i in "${!CHANGED_SERVICES[@]}"; do
            [ $i -gt 0 ] && MATRIX_JSON+=","
            MATRIX_JSON+="\"${CHANGED_SERVICES[$i]}\""
          done
          MATRIX_JSON+="]"

          echo "changed-services=${CHANGED_SERVICES[*]}" >> $GITHUB_OUTPUT
          echo "matrix={\"service\":$MATRIX_JSON}" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT

          echo "📊 Services to build: ${CHANGED_SERVICES[*]}"

  deploy:
    name: Deploy ${{ matrix.service }} → ${{ needs.detect-changes.outputs.has-changes == 'true' && (github.ref_name == 'main' && 'prod' || 'dev') || '' }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to switch to gitops branch later

      - name: Set environment variables
        run: |
          ENV="${{ env.ENVIRONMENT }}"
          TAG="${ENV}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "ENV=${ENV}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VALUES_FILE=values-${ENV}.yaml" >> $GITHUB_ENV
          echo "🎯 Environment: ${ENV}"
          echo "🏷️  Image tag:   ${TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          ECR_REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/retail-store-${SERVICE}"

          echo "🔨 Building ${SERVICE}:${TAG}"

          # Create ECR repo if it doesn't exist
          aws ecr describe-repositories --repository-names "retail-store-${SERVICE}" 2>/dev/null || \
          aws ecr create-repository --repository-name "retail-store-${SERVICE}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

          # Build and push with env-prefixed tag + env-latest alias
          docker build -t "${ECR_REPO}:${TAG}" -t "${ECR_REPO}:${ENV}-latest" "src/${SERVICE}/"
          docker push "${ECR_REPO}:${TAG}"
          docker push "${ECR_REPO}:${ENV}-latest"

          echo "✅ Pushed ${ECR_REPO}:${TAG}"
          echo "ECR_REPO=${ECR_REPO}" >> $GITHUB_ENV

      - name: Switch to gitops branch and update Helm values
        run: |
          SERVICE="${{ matrix.service }}"
          VALUES_FILE_PATH="src/${SERVICE}/chart/${VALUES_FILE}"

          git config --local user.email "gitops@github.com"
          git config --local user.name "GitOps Bot"

          # Switch to gitops branch (values files live here)
          git fetch origin gitops
          git checkout gitops

          # Ensure the env-specific values file exists
          if [[ ! -f "${VALUES_FILE_PATH}" ]]; then
            echo "⚠️  ${VALUES_FILE_PATH} not found — creating minimal override"
            echo "image:" > "${VALUES_FILE_PATH}"
            echo "  repository: ${ECR_REPO}" >> "${VALUES_FILE_PATH}"
            echo "  tag: \"${TAG}\"" >> "${VALUES_FILE_PATH}"
          else
            # Update only image.repository and image.tag in the override file
            cp "${VALUES_FILE_PATH}" "${VALUES_FILE_PATH}.bak"

            awk -v repo="${ECR_REPO}" -v tag="${TAG}" '
              BEGIN { in_image=0; done_repo=0; done_tag=0 }
              /^image:/ { in_image=1; print; next }
              in_image && /^[[:space:]]*repository:/ && !done_repo {
                print "  repository: " repo; done_repo=1; next
              }
              in_image && /^[[:space:]]*tag:/ && !done_tag {
                print "  tag: \"" tag "\""; done_tag=1; next
              }
              /^[a-zA-Z]/ && !/^image:/ { in_image=0 }
              { print }
            ' "${VALUES_FILE_PATH}.bak" > "${VALUES_FILE_PATH}"

            # Verify update succeeded
            if grep -q "\"${TAG}\"" "${VALUES_FILE_PATH}"; then
              echo "✅ Updated ${VALUES_FILE_PATH} → tag: ${TAG}"
              rm "${VALUES_FILE_PATH}.bak"
            else
              echo "❌ Update failed — restoring backup"
              mv "${VALUES_FILE_PATH}.bak" "${VALUES_FILE_PATH}"
              exit 1
            fi
          fi

          echo "📋 Final values:"
          grep -A3 "^image:" "${VALUES_FILE_PATH}"

      - name: Commit and push to gitops
        run: |
          SERVICE="${{ matrix.service }}"
          VALUES_FILE_PATH="src/${SERVICE}/chart/${VALUES_FILE}"

          if ! git diff --quiet "${VALUES_FILE_PATH}"; then
            git add "${VALUES_FILE_PATH}"
            git commit -m "🚀 Update ${SERVICE} Helm chart to ${TAG} - ECR: retail-store-${SERVICE} - Commit: ${{ github.sha }}"

            for i in {1..3}; do
              if git push origin gitops; then
                echo "✅ Pushed Helm update for ${SERVICE} (${ENV})"
                break
              else
                echo "⚠️ Push conflict — retry $i/3"
                git pull --rebase origin gitops
                sleep $((i * 2))
              fi

              if [ $i -eq 3 ]; then
                echo "❌ Failed to push after 3 attempts"
                exit 1
              fi
            done
          else
            echo "📝 No Helm changes for ${SERVICE} (${ENV})"
          fi

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          ENV="${{ env.ENVIRONMENT }}"
          NS="retail-store-${ENV}"

          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${ENV}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`${NS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image tag** | \`${ENV}-$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.has-changes }}" == "true" ]; then
            echo "**Changed Services:** ${{ needs.detect-changes.outputs.changed-services }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.deploy.result }}" == "success" ]; then
              echo "✅ **Status:** Deployment successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Actions completed:**" >> $GITHUB_STEP_SUMMARY
              echo "- 🔨 Built and pushed Docker images to ECR with tag \`${ENV}-<sha>\`" >> $GITHUB_STEP_SUMMARY
              echo "- 📝 Updated \`values-${ENV}.yaml\` on \`gitops\` branch" >> $GITHUB_STEP_SUMMARY
              echo "- 🔄 ArgoCD will sync \`${NS}\` namespace automatically" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Status:** Deployment failed — check workflow logs" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ **Status:** No services changed — skipped" >> $GITHUB_STEP_SUMMARY
          fi
